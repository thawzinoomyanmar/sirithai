[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  publish = "dist"

[[redirects]]
  from = "/api/webhook/clerk"
  to = "/.netlify/functions/webhooks-clerk"
  status = 200

[[redirects]]
  from = "/api/webhooks/clerk"
  to = "/.netlify/functions/webhooks-clerk"
  status = 200

[[redirects]]
  from = "/api/profile"
  to = "/.netlify/functions/profile"
  status = 200

[[redirects]]
  from = "/api/admin/users"
  to = "/.netlify/functions/admin-users"
  status = 200

[[redirects]]
  from = "/api/admin/transactions"
  to = "/.netlify/functions/admin-transactions"
  status = 200

[[redirects]]
  from = "/api/admin/update-status"
  to = "/.netlify/functions/admin-update-status"
  status = 200

[[redirects]]
  from = "/api/admin/delete-user"
  to = "/.netlify/functions/admin-delete-user"
  status = 200

[[redirects]]
  from = "/api/users/sync"
  to = "/.netlify/functions/users-sync"
