[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  publish = "dist"

[[redirects]]
  from = "/api/webhook/clerk"
  to = "/.netlify/functions/webhooks-clerk"
  status = 200

[[redirects]]
  from = "/api/webhooks/clerk"
  to = "/.netlify/functions/webhooks-clerk"
  status = 200

[[redirects]]
  from = "/api/profile"
  to = "/.netlify/functions/profile"
  status = 200

[[redirects]]
  from = "/api/user-courses"
  to = "/.netlify/functions/user-courses"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
